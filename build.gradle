plugins {
    id 'fabric-loom' version '1.17.17'
    id 'maven-publish'
}
version = '1.0.1'
group = 'nl.songplayer'
base { archivesName = 'song-player' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    mappings 'net.fabricmc:intermediary:26.3'
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.165.0+26.3'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
